# Clash / Mihomo 独立订阅模板。将 example.net、192.0.2.10 及 vps-sub.url 换成自己的值。
# vps-sub 经 DIRECT 下载节点。请让节点源依次提供 01 REALITY 直连、02 Hysteria2 备用、☁️ Cloudflare Tunnel。
# AI 服务规则优先于通用服务和 UDP 规则。部署专有规则可由面板的完整订阅下发。
# 标准分组和公开规则改编自 Aethersailor / Custom_OpenClash_Rules，保留来源署名。
# https://github.com/Aethersailor/Custom_OpenClash_Rules/tree/8335eb2b8205ca2e3573cd7267d5b1e423637084
# 此改编模板采用 CC BY-SA 4.0。https://creativecommons.org/licenses/by-sa/4.0/

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: always
geodata-mode: true
tcp-concurrent: true
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  prefer-h3: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#入站协议
  - https://8.8.8.8/dns-query#入站协议
  - https://dns.cloudflare.com/dns-query#入站协议
  - https://dns.google/dns-query#入站协议
  fallback:
  - https://1.1.1.1/dns-query#入站协议
  - https://8.8.8.8/dns-query#入站协议
  - tls://1.1.1.1#入站协议
  - tls://8.8.8.8#入站协议
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    +.cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.example.net:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - system
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:private:
    - system
    - 223.5.5.5
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - +.local
  - +.localhost
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - www.msftconnecttest.com
  - +.msftncsi.com
  - geosite:cn
  - geosite:private
  - '*.cn'
  - +.cn
  - stun.*.*
  - stun.*.*.*
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - ntp.*.com.cn
  - +.market.xiaomi.com
  - +.stun.*.*
  - +.stun.*.*.*
tun:
  enable: true
  stack: system
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
proxy-providers:
  vps-sub:
    type: http
    url: https://sub.example.net/replace-with-your-subscription-path
    proxy: DIRECT
    interval: 3600
    path: ./providers/vps-sub.yaml
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      expected-status: 204
      interval: 15
      timeout: 5000
      lazy: false
proxies: []
proxy-groups:
- name: 入站协议
  type: select
  proxies:
  - 自动切换
  filter: ^(01 REALITY 直连|02 Hysteria2 备用|☁️ Cloudflare Tunnel)$
  empty-fallback: REJECT
  use:
  - vps-sub
- name: 自动切换
  type: fallback
  filter: ^(01 REALITY 直连|02 Hysteria2 备用|☁️ Cloudflare Tunnel)$
  empty-fallback: REJECT
  url: https://cp.cloudflare.com/generate_204
  expected-status: 204
  interval: 15
  timeout: 5000
  lazy: false
  use:
  - vps-sub
