# Clash Meta / mihomo 通用模板：Claude 家宽出口分流
# ------------------------------------------------------------
# 用法：
# 1. 把下面 proxy-providers.vps-sub.url 改成你的订阅地址
#    （形如 https://sub.你的域名/... ，不要用中转 VPS 裸 IP）
# 2. 把 rules 里 panel.你的域名 / sub.你的域名 改成你自己的面板与订阅域名
# 3. 导入本文件后，在策略组里手动选节点：
#    - 「🤖 人工智能」选 VLESS（TCP/Reality）节点 → 服务器侧再出家宽 SOCKS5
#    - 「⚡ UDP加速」选 Hysteria2 节点 → WebRTC / STUN 走这里，不要 REJECT
#    - 「🚀 节点选择」日常境外；国内 / 微信走 DIRECT
# 4. 面板与订阅域名必须 DIRECT，避免代理挂了更新不了订阅
# ------------------------------------------------------------
# 本模板已去掉真实节点 IP / UUID / 密码 / 个人域名；规则是策略精华版，
# 不是完整 ACL 列表。日常翻墙可自行叠加 rule-providers / 订阅转换。
# ------------------------------------------------------------

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: always
tcp-concurrent: true
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  prefer-h3: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#🚀 节点选择
  - https://8.8.8.8/dns-query#🚀 节点选择
  - https://dns.cloudflare.com/dns-query#🚀 节点选择
  - https://dns.google/dns-query#🚀 节点选择
  fallback:
  - https://1.1.1.1/dns-query#🚀 节点选择
  - https://8.8.8.8/dns-query#🚀 节点选择
  - tls://1.1.1.1#🚀 节点选择
  - tls://8.8.8.8#🚀 节点选择
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    +.cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.你的域名:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - system
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:private:
    - system
    - 223.5.5.5
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - +.local
  - +.localhost
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - www.msftconnecttest.com
  - +.msftncsi.com
  - geosite:cn
  - geosite:private
  - '*.cn'
  - +.cn
  - stun.*.*
  - stun.*.*.*
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - ntp.*.com.cn
  - +.market.xiaomi.com
  - +.stun.*.*
  - +.stun.*.*.*
tun:
  enable: true
  stack: system
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
proxy-providers:
  vps-sub:
    type: http
    url: https://sub.你的域名/把这里换成你的订阅路径
    interval: 3600
    path: ./providers/vps-sub.yaml
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300
proxies: []  # 推荐用上方 proxy-providers；若手写节点可在此填写
proxy-groups:
- name: 🚀 节点选择
  type: select
  use:
  - vps-sub
  proxies:
  - DIRECT
- name: 🤖 人工智能
  type: select
  use:
  - vps-sub
  proxies:
  - 🚀 节点选择
  - DIRECT
- name: ⚡ UDP加速
  type: select
  use:
  - vps-sub
  proxies:
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  use:
  - vps-sub
  proxies:
  - 🚀 节点选择
  - DIRECT
