# Clash Meta / Mihomo 双层分流模板
# 将 example.net、192.0.2.10 和 vps-sub.url 换成自己的域名、源站 IPv4 和订阅链接。
# vps-sub 通过 DIRECT 拉取。panel 和 sub 域名的普通访问按规则走默认代理。
# 订阅节点名称保留 REALITY、Hysteria2 和 Cloudflare 关键词，顺序由订阅提供。
# 这是精简模板。现网完整规则由 3x-ui Clash 订阅发布。

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false
find-process-mode: always
tcp-concurrent: true
unified-delay: true
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  respect-rules: true
  use-hosts: true
  prefer-h3: false
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
  nameserver:
  - https://1.1.1.1/dns-query#🌐 默认代理
  - https://8.8.8.8/dns-query#🌐 默认代理
  - https://dns.cloudflare.com/dns-query#🌐 默认代理
  - https://dns.google/dns-query#🌐 默认代理
  fallback:
  - https://1.1.1.1/dns-query#🌐 默认代理
  - https://8.8.8.8/dns-query#🌐 默认代理
  - tls://1.1.1.1#🌐 默认代理
  - tls://8.8.8.8#🌐 默认代理
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
    - gfw
    ipcidr:
    - 240.0.0.0/4
  nameserver-policy:
    +.cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    +.example.net:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    - system
    geosite:cn:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
    geosite:private:
    - system
    - 223.5.5.5
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - 223.5.5.5
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - +.local
  - +.localhost
  - localhost.ptlogin2.qq.com
  - +.msftconnecttest.com
  - www.msftconnecttest.com
  - +.msftncsi.com
  - geosite:cn
  - geosite:private
  - '*.cn'
  - +.cn
  - stun.*.*
  - stun.*.*.*
  - time.*.com
  - time.*.gov
  - time.*.edu.cn
  - time.*.apple.com
  - ntp.*.com
  - ntp.*.com.cn
  - +.market.xiaomi.com
  - +.stun.*.*
  - +.stun.*.*.*
tun:
  enable: true
  stack: system
  dns-hijack:
  - any:53
  auto-route: true
  auto-detect-interface: true
  strict-route: true
sniffer:
  enable: true
  force-dns-mapping: true
  override-destination: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports:
      - 80
      - 8080-8880
    TLS:
      ports:
      - 443
      - 8443
    QUIC:
      ports:
      - 443
      - 8443
proxy-providers:
  vps-sub:
    type: http
    url: https://sub.example.net/replace-with-your-subscription-path
    proxy: DIRECT
    interval: 3600
    path: ./providers/vps-sub.yaml
    health-check:
      enable: true
      url: https://www.cloudflare.com/cdn-cgi/trace
      interval: 300
proxies: []
proxy-groups:
- name: ☁️ CDN 线路
  type: select
  use: [vps-sub]
  filter: '(?i)Cloudflare'
  empty-fallback: REJECT
  hidden: true
- name: 🔁 直连优先
  type: fallback
  use: [vps-sub]
  filter: '(?i)REALITY|Hysteria2|Cloudflare'
  url: https://www.cloudflare.com/cdn-cgi/trace
  interval: 180
  timeout: 8000
  lazy: true
  empty-fallback: REJECT
- name: 🌐 默认代理
  type: select
  proxies:
  - ☁️ CDN 线路
  - 🔁 直连优先
  - DIRECT
- name: 🤖 人工智能
  type: select
  proxies:
  - ☁️ CDN 线路
  - 🔁 直连优先
  - 🌐 默认代理
  - DIRECT
- name: 📡 UDP 流量
  type: select
  proxies:
  - ☁️ CDN 线路
  - 🔁 直连优先
  - 🌐 默认代理
  - DIRECT
- name: 🐟 漏网之鱼
  type: select
  proxies:
  - 🌐 默认代理
  - ☁️ CDN 线路
  - 🔁 直连优先
  - DIRECT
  - REJECT
